name: Refresh AR dollar rates

on:
  schedule:
    # Hourly 10:07–18:07 ART weekdays (13:07–21:07 UTC Mon–Fri), so BNA/MEP
    # are same-day. Plus one night run at 03:07 ART (06:07 UTC). Each job
    # makes a single GET to DolarApi /v1/dolares.
    - cron: "7 13-21 * * 1-5"
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata
        run: pip install --quiet tzdata
      - name: Fetch rates
        run: python3 scripts/refresh-fx.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx-ar.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh AR dollar rates"
          git pull --rebase
          git push
