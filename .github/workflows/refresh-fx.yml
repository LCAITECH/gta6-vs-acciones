name: Refresh AR dollar rates

on:
  schedule:
    # Every 3 hours (DolarApi suggests at most one query per series every 3h).
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates
        run: python3 scripts/refresh-fx.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx-ar.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh AR dollar rates"
          git pull --rebase
          git push
