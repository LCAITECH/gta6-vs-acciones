name: Refresh AR dollar rates

on:
  schedule:
    # Three runs per business day, 3 hours apart (DolarApi asks for at most one query every 3 hours per
    # series): 14:11, 17:11 and 20:11 UTC = 11:11, 14:11 and 17:11 ART. Plus one night run at 06:11 UTC.
    # Each job makes a single GET to DolarApi /v1/dolares.
    - cron: "11 14,17,20 * * 1-5"
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata
        run: pip install --quiet tzdata
      - name: Fetch rates
        run: python3 scripts/refresh-fx.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fx-ar.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh AR dollar rates"
          git pull --rebase
          git push
