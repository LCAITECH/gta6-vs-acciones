name: Refresh TTWO quote

on:
  schedule:
    # The site works with daily closes, so one run after the Nasdaq close is enough (21:00 UTC in winter,
    # 20:00 UTC in summer). GitHub's `schedule` is best effort: a run can be late or skipped, so there is a
    # second attempt a few hours later. Each scheduled run rewrites the whole history, so a skipped day heals
    # itself on the next run that does fire. Minutes are off the :00/:15/:30/:45 marks on purpose.
    - cron: "37 22 * * 1-5"
    - cron: "17 2 * * 2-6"
  workflow_dispatch:
    inputs:
      history:
        description: "Also refresh the full daily history (official closes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata
        run: pip install --quiet tzdata
      - name: Fetch snapshot
        env:
          EVENT: ${{ github.event_name }}
          HISTORY: ${{ github.event.inputs.history }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$HISTORY" = "true" ]; then
            # Scheduled (after the close) or on demand: daily history with official closes + latest quote.
            python3 scripts/refresh-ttwo.py
          else
            # Manual run without history: quote only (also appends the session that just closed).
            python3 scripts/refresh-ttwo.py --quote
          fi
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ttwo-latest.json data/ttwo-daily.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh TTWO quote snapshot"
          git pull --rebase
          git push
