name: Refresh TTWO quote

on:
  schedule:
    # Every 15 minutes during US regular hours, in UTC.
    # Mon–Fri 14:00–21:45 UTC ≈ 11:00–18:45 America/Buenos_Aires
    # (covers the 9:30–16:00 America/New_York session, including after the close print).
    - cron: "*/15 14-21 * * 1-5"
    # Once after the close (21:00 UTC in winter, 20:00 UTC in summer) to store the official
    # daily close. Keep this string in sync with the check in the "Fetch snapshot" step.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      history:
        description: "Also refresh the full daily history (official closes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata
        run: pip install --quiet tzdata
      - name: Fetch snapshot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          HISTORY: ${{ github.event.inputs.history }}
        run: |
          if [ "$SCHEDULE" = "30 22 * * 1-5" ] || [ "$HISTORY" = "true" ]; then
            # After the close (or on demand): daily history with official closes + latest quote.
            python3 scripts/refresh-ttwo.py
          else
            # Intraday: quote only (also appends the session that just closed).
            python3 scripts/refresh-ttwo.py --quote
          fi
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ttwo-latest.json data/ttwo-daily.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh TTWO quote snapshot"
          git pull --rebase
          git push
