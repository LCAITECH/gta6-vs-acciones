name: Refresh hardware prices

on:
  schedule:
    # About every 6 hours.
    - cron: "19 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata
        run: pip install --quiet tzdata
      - name: Fetch hardware prices
        run: python3 scripts/refresh-hardware.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hardware-prices.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh hardware prices"
          git pull --rebase
          git push
