name = "gta6-cron"
main = "src/index.js"
compatibility_date = "2026-11-01"
account_id = "e5dea32e1d9e7766b2ff8f500c2b2ae0"
# Sin URL pública: este Worker solo corre por cron, no atiende requests.
workers_dev = false

# Una sola cron cada 15 minutos (el plan gratis permite pocas): src/index.js decide qué workflows salen en cada tick.
[triggers]
crons = ["*/15 * * * *"]

[vars]
GH_REPO = "LCAITECH/gta6-vs-acciones"
GH_REF = "main"

# Secret (no commiteado): GH_TOKEN -> npx wrangler secret put GH_TOKEN
# Es un fine-grained PAT limitado a este repo con "Actions: Read and write". Nada más.
