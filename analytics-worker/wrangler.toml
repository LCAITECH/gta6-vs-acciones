name = "gta6-analytics"
main = "src/index.js"
compatibility_date = "2026-11-01"
account_id = "e5dea32e1d9e7766b2ff8f500c2b2ae0"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "gta6-analytics"
database_id = "0768854c-d3b6-4d3c-b378-6378629945f8"

# Secret (not committed): STATS_KEY  ->  npx wrangler secret put STATS_KEY

# Native rate limiting for poll votes (keys are not stored).
[[ratelimits]]
name = "POLL_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Native rate limiting for analytics events (/e). Keys are not stored. The Origin check only stops other
# websites; this stops scripts from flooding D1 with fake events. Needs its own namespace_id.
[[ratelimits]]
name = "EVENT_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
